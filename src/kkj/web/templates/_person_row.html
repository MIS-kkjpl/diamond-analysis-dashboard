{# One salesperson; any change saves this row (hx-trigger=change) and swaps it back. #}
<tr hx-post="/settings/salesperson/{{ p.sales_code }}" hx-trigger="change" hx-include="this" hx-target="this"
    hx-swap="outerHTML" {% if saved %}class="row-saved"{% endif %}>
  <td class="text-nowrap">{{ p.sales_code }}</td>
  <td><input class="form-control form-control-sm" name="name" value="{{ p.name }}" {% if not who %}disabled{% endif %}></td>
  <td><input class="form-control form-control-sm" name="employee_code" value="{{ p.employee_code or '' }}" style="width: 6rem" {% if not who %}disabled{% endif %}></td>
  <td><input class="form-control form-control-sm" name="branch" value="{{ p.branch or '' }}" {% if not who %}disabled{% endif %}></td>
  <td><select class="form-select form-select-sm" name="kind" {% if not who %}disabled{% endif %}>
    {% for k in kinds %}<option value="{{ k }}" {% if p.kind == k %}selected{% endif %}>{{ k }}</option>{% endfor %}</select></td>
  <td class="text-center"><input class="form-check-input" type="checkbox" name="active" {% if p.active %}checked{% endif %} {% if not who %}disabled{% endif %}></td>
  <td><input class="form-control form-control-sm" type="date" name="left_on" value="{{ p.left_on if p.left_on else '' }}" {% if not who %}disabled{% endif %}></td>
  <td>{% set mc = {"matched": "green", "name_match": "yellow", "manual": "blue", "unmapped": "orange"} %}
    <span class="badge bg-{{ mc.get(p.match_status, 'secondary') }}-lt">{{ p.match_status | replace("_", " ") }}</span>
    {% if saved %}<i class="ti ti-check text-green ms-1" title="Saved"></i>{% endif %}</td>
  <td><input class="form-control form-control-sm" name="note" value="{{ p.note or '' }}" {% if not who %}disabled{% endif %}></td>
</tr>
