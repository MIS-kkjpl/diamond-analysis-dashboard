{% if status %}
<span class="sw-status" title="Recommendations last refreshed {{ status.finished | date('%d %b %Y %H:%M') }}">
  Stock {{ status.stock_as_of | date("%d %b") }} <span class="sep">·</span> Sales to {{ status.sales_to | date("%d %b") }}
  <span class="sep">·</span> Refreshed {{ status.finished | ago }}</span>
{% else %}
<span class="sw-status">Not refreshed yet</span>
{% endif %}
